<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Start Page</title>
        <link rel="stylesheet" href="../styles/styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <h1>3 Suspects...</h1>
            <p>These are the people you suspect of revealing the truth about you, but who really did it?
                <br> Click on each person to learn more about them.</p>
            <div class="suspects">
                <div class="suspect-card" data-id="0">
                    <span class="suspect-name">Lily</span>
                    <span class="suspect-role">Best Friend</span>
                </div>

                <div class="suspect-card" data-id="1">
                    <span class="suspect-name">Cameron</span>
                    <span class="suspect-role">Family Friend</span>
                </div>

                <div class="suspect-card" data-id="2">
                    <span class="suspect-name">Matteo</span>
                    <span class="suspect-role">Crush</span>
                </div>
            </div>

            <div class="who-did-it">
                <p>Who do you think exposed the truth?</p>
                <div class="button-row">
                    <button class="button" onclick="location.href='../endings/lily-ending.html'">Lily</button>
                    <button class="button" onclick="location.href='../endings/cameron-ending.html'">Cameron</button>
                    <button class="button" onclick="location.href='../endings/matteo-ending.html'">Matteo</button>
                </div>
            </div>
        </div>

        <div id="overlay">
            <div id="modal">
                <button id="close-btn">&times;</button>
                <h2 id="modal-name"></h2>
                <p id="modal-role"></p>
                <p id="modal-bio"></p>
            </div>
        </div>

        <script>
            const suspects = [
                {
                    name: "Lily",
                    role: "Best Friend",
                    bio: "You and Lily have been best friends ever since middle school started in grade 6. She was the most relatable person in your school. Today you decided to casually bring up the topic of your job:\nYou: 'Hey Lily, I know there has been gossip about me having a job and being poor...'\nLily: 'Yeah, I really don't know why they would say that about you, but I'm honestly not surprised.'\nYou: 'What do you mean?'\nLily: 'Uh I mean... our school is like the queen of gossip, so what can you expect?'\nYou: 'Really. But either way, they shouldn't know that I have a job, unless you told them.'\nLily: 'What? I didn't! Why would you suspect me?'\nJust then, the bell rings and Lily leaves to go to her next class. Although she's your friend, Lily seemed a little suspicious and... rude."
                },
                {
                    name: "Cameron",
                    role: "Family Friend",
                    bio: "Cameron was one of the family friends that you could talk to without being awkward because he was the same age as you. You and Cameron seemed to have developed a bond in some way. You knew he liked to pull pranks and he was pretty pesky. At a family gathering, you decided to ask him about the gossip:\nYou: 'By the way, Cameron, do you know anything about the gossip going around school about me having a job?'\nCameron: 'Oh, yeah. Damn, some level of respect they got there.'\nYou: 'Stop joking around, I'm being serious.'\nCameron: 'Well, I heard that someone from school saw you working at the bakery.'\nYou: '... Who in their twisted mind would do that?'\nCameron: 'I don't know. It could be anyone. Everyone has twisted minds in this school, no? Maybe even one of your friends!'\nCameron seemed to be enjoying this conversation a little too much. He was smiling and half-laughing as we talked, which gave you a queasy feeling it had something to do with him."
                },
                {
                    name: "Matteo",
                    role: "Crush",
                    bio: "Matteo was your all-time middle school crush ever since 6th grade. You two grew pretty close, but the relationship feels somewhat awkward. He's a nice guy. Maybe you're the one who makes things awkward. You mustered the courage to ask him about the gossip, trying to not be weird or awkward. Naturally, you failed with both.\nYou: 'Hey Matteo, can I ask you something?'\nMatteo: 'Sure.'\nYou: 'Do you remember when I told you about my job a little while ago?'\nMatteo: 'At the bakery? Yeah, what about it?'\nYou: 'I'm sure you know... about the gossip going around?'\nMatteo: 'Oh, that. I heard something about it, but I don't really know the details. Do you think I told people about your job?'\nYou: 'Oh... uh, no, I don't! I was just curious.'\nMatteo: 'That's good. So, you trust me right?'\nYou: 'Yeah, of course, Matteo! See you tomorrow?'\nHe waved, then left. You puffed out air you didn't even know you were holding. You were just glad the conversation was done because it was so awkward."
                }
            ];

            const overlay = document.getElementById('overlay');

            function openModal(id) {
                const s = suspects[id];
                document.getElementById('modal-name').textContent = s.name;
                document.getElementById('modal-role').textContent = s.role;
                document.getElementById('modal-bio').textContent = s.bio;
                overlay.classList.add('open');
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {
                overlay.classList.remove('open');
                document.body.style.overflow = '';
            }

            document.querySelectorAll('.suspect-card').forEach(card => {
                card.addEventListener('click', () => openModal(parseInt(card.dataset.id)));
            });

            document.getElementById('close-btn').addEventListener('click', closeModal);

            overlay.addEventListener('click', e => {
                if (e.target === overlay) closeModal();
            });

            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') closeModal();
            });
        </script>
    </body>
</html>
